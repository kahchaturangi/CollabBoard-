name: CollabBoard CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Server Dependencies & Test
      run: |
        cd server
        npm install
        npm test

    - name: Install Client Dependencies & Test
      run: |
        cd client
        npm install --legacy-peer-deps
        npm test